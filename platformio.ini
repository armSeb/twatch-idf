; T-Watch 2020 V1 — ESP-IDF pur + LVGL 9 + NimBLE (ANCS)
;
; espressif32@6.13.0 = dernière plateforme sur ESP-IDF 5.x, MAIS elle embarque
; ESP-IDF 5.5.3 dont le contrôleur BT ESP32 (libbtdm 045a658) fait mourir la
; liaison iPhone en 0x208 juste après le chiffrement. Corrigé dans le
; contrôleur d'ESP-IDF 5.5.6 (libbtdm 919c7f4) : on force ce framework.

[platformio]
src_dir = main
default_envs = twatch2020v1

[env:twatch2020v1]
platform = espressif32@6.13.0
platform_packages =
    framework-espidf @ https://github.com/espressif/esp-idf.git#v5.5.6
framework = espidf
board = ttgo-t-watch
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
