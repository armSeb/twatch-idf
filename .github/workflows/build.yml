name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests PC (ASan/UBSan)
        run: host_tests/run.sh

  firmware:
    runs-on: ubuntu-latest
    # ESP-IDF 5.5.6 obligatoire : le contrôleur BT de 5.5.3 casse la liaison iPhone
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build
      - name: Image complète (0x0)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          mkdir -p dist
          cd build
          esptool.py --chip esp32 merge_bin -o ../dist/twatch2020v1-full.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x1000 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 twatch.bin
          cp twatch.bin ../dist/twatch2020v1-app.bin
          cp twatch.elf ../dist/twatch2020v1.elf
      - uses: actions/upload-artifact@v4
        with:
          name: twatch2020v1-firmware
          path: dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/twatch2020v1-full.bin
            dist/twatch2020v1-app.bin
