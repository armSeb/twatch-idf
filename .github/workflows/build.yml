name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PC tests (ASan/UBSan) and translations
        run: host_tests/run.sh

  firmware:
    runs-on: ubuntu-latest
    # ESP-IDF 5.5.6 is mandatory: the 5.5.3 BT controller breaks the iPhone link
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build
      - name: Build without TV off (no CC BY-SA content)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          TW_NO_TVOFF=1 idf.py -B build-notvoff build
      - name: Full image (0x0) and release files
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          mkdir -p dist
          cd build
          esptool.py --chip esp32 merge_bin -o ../dist/twatch2020v1-full.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x1000 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 ota_data_initial.bin \
            0x20000 twatch.bin
          cp twatch.bin ../dist/twatch2020v1-app.bin
          cp bootloader/bootloader.bin ../dist/bootloader.bin
          cp partition_table/partition-table.bin ../dist/partition-table.bin
          cp ota_data_initial.bin ../dist/ota_data_initial.bin
          cp twatch.elf ../dist/twatch2020v1.elf
          cp ../build-notvoff/twatch.bin ../dist/twatch2020v1-app-notvoff.bin
          cp ../LICENSE ../THIRD_PARTY_NOTICES.md ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: twatch2020v1-firmware
          path: dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/twatch2020v1-full.bin
            dist/twatch2020v1-app.bin
            dist/twatch2020v1-app-notvoff.bin
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
